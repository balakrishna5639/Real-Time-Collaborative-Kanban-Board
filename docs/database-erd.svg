<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="tenantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="taskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Title & Legend -->
  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="700">Multi-Organization &amp; Multi-Tenant Database Schema</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">Strict Tenant Isolation (tenant_id) • 8 Normalized Tables • Optimistic Concurrency Control</text>

  <!-- Legend -->
  <g transform="translate(850, 25)">
    <rect width="310" height="50" rx="8" fill="#1e293b" stroke="#334155" />
    <circle cx="20" cy="25" r="6" fill="#4f46e5" />
    <text x="35" y="29" fill="#e2e8f0" font-size="11">Hierarchy Anchor</text>
    <circle cx="150" cy="25" r="6" fill="#059669" />
    <text x="165" y="29" fill="#34d399" font-size="11">Tenant Isolation (tenant_id)</text>
  </g>

  <!-- 1. ORGANIZATIONS -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="240" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 38 L 0 38 Z" fill="url(#headerGrad)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">organizations</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12">name : VARCHAR(255)</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">UQ</tspan> slug : VARCHAR(100)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="11">created_at, updated_at</text>
  </g>

  <!-- 2. TENANTS -->
  <g transform="translate(360, 110)" filter="url(#shadow)">
    <rect width="250" height="180" rx="10" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 38 L 0 38 Z" fill="url(#tenantGrad)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">tenants (branches)</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> organization_id : UUID</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="12">name : VARCHAR(255)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">UQ</tspan> slug : VARCHAR(100)</text>
    <text x="15" y="160" fill="#94a3b8" font-size="11">created_at, updated_at</text>
  </g>

  <!-- 3. USERS -->
  <g transform="translate(50, 320)" filter="url(#shadow)">
    <rect width="240" height="175" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 230 0 Q 240 0 240 10 L 240 38 L 0 38 Z" fill="#334155"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">users</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12">name : VARCHAR(255)</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">UQ</tspan> email : VARCHAR(255)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12">password_hash : VARCHAR</text>
    <text x="15" y="160" fill="#94a3b8" font-size="11">avatar_url, created_at</text>
  </g>

  <!-- 4. MEMBERSHIPS -->
  <g transform="translate(50, 560)" filter="url(#shadow)">
    <rect width="260" height="200" rx="10" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 38 L 0 38 Z" fill="url(#headerGrad)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">memberships (RBAC)</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> user_id : UUID</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> organization_id : UUID</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12"><tspan fill="#059669" font-weight="bold">FK</tspan> tenant_id : UUID (nullable)</text>
    <text x="15" y="160" fill="#a5b4fc" font-size="12" font-weight="600">role : ORG_ADMIN | TENANT_ADMIN | MEMBER</text>
    <text x="15" y="185" fill="#94a3b8" font-size="11">created_at, updated_at</text>
  </g>

  <!-- 5. BOARDS -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <rect width="250" height="185" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 38 L 0 38 Z" fill="url(#headerGrad)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">boards</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> organization_id : UUID</text>
    <text x="15" y="110" fill="#34d399" font-size="12" font-weight="600"><tspan fill="#059669">FK</tspan> tenant_id : UUID (Scoped)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12">name, description</text>
    <text x="15" y="160" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> created_by : UUID</text>
  </g>

  <!-- 6. COLUMNS -->
  <g transform="translate(680, 360)" filter="url(#shadow)">
    <rect width="250" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 38 L 0 38 Z" fill="#334155"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">columns</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> board_id : UUID</text>
    <text x="15" y="110" fill="#34d399" font-size="12" font-weight="600"><tspan fill="#059669">FK</tspan> tenant_id : UUID (Scoped)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12">name : VARCHAR(100), position : INT</text>
  </g>

  <!-- 7. TASKS -->
  <g transform="translate(680, 580)" filter="url(#shadow)">
    <rect width="260" height="260" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 250 0 Q 260 0 260 10 L 260 38 L 0 38 Z" fill="url(#taskGrad)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">tasks (OCC Enabled)</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> board_id : UUID, column_id : UUID</text>
    <text x="15" y="110" fill="#34d399" font-size="12" font-weight="600"><tspan fill="#059669">FK</tspan> tenant_id : UUID (Scoped)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12">title : VARCHAR, description : TEXT</text>
    <text x="15" y="160" fill="#cbd5e1" font-size="12">priority : LOW | MED | HIGH | URGENT</text>
    <text x="15" y="185" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> assigned_to : UUID, due_date</text>
    <text x="15" y="210" fill="#cbd5e1" font-size="12">position : INT</text>
    <text x="15" y="235" fill="#fde047" font-size="12" font-weight="bold">version : INT (OCC Concurrency)</text>
  </g>

  <!-- 8. ACTIVITY LOGS -->
  <g transform="translate(360, 480)" filter="url(#shadow)">
    <rect width="250" height="200" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 38 L 0 38 Z" fill="#334155"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="bold">activity_logs</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK</tspan> id : UUID</text>
    <text x="15" y="85" fill="#34d399" font-size="12" font-weight="600"><tspan fill="#059669">FK</tspan> tenant_id : UUID (Scoped)</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="12"><tspan fill="#38bdf8">FK</tspan> user_id : UUID</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12">entity_type : TASK | BOARD | COL</text>
    <text x="15" y="160" fill="#cbd5e1" font-size="12">action : CREATED | UPDATED | MOVED</text>
    <text x="15" y="185" fill="#cbd5e1" font-size="12">details : JSONB, created_at</text>
  </g>

  <!-- Connectors -->
  <!-- Org -> Tenant -->
  <path d="M 290 180 L 360 180" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <!-- Tenant -> Board -->
  <path d="M 610 180 L 680 180" stroke="#059669" stroke-width="2" fill="none" />
  <!-- Board -> Column -->
  <path d="M 800 295 L 800 360" stroke="#6366f1" stroke-width="2" fill="none" />
  <!-- Column -> Task -->
  <path d="M 800 520 L 800 580" stroke="#f59e0b" stroke-width="2" fill="none" />
  <!-- Tenant -> ActivityLog -->
  <path d="M 480 290 L 480 480" stroke="#059669" stroke-width="1.5" stroke-dasharray="4" fill="none" />
</svg>

